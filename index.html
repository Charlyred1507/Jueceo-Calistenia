<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>AI Calisthenics Judge — Push-ups V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#111}
video,#output{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{z-index:1}
#output{z-index:2}
.panel{position:absolute;z-index:5;background:rgba(8,10,14,.78);
backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);
border-radius:14px;padding:10px 12px}
#top{top:12px;left:12px;right:12px;display:flex;gap:8px;
align-items:center;justify-content:space-between}
#exerciseSelect,#startBtn{border:0;border-radius:10px;padding:10px 12px;font-size:15px}
#exerciseSelect{background:#1d222a;color:#fff}
#startBtn{background:#19a463;color:#fff;font-weight:700;cursor:pointer}
#startBtn:disabled{opacity:.55}
#counter{font-size:24px;font-weight:800;padding:8px 14px;
border-radius:12px;background:rgba(0,0,0,.7)}
#status{left:50%;transform:translateX(-50%);bottom:18px;
max-width:92%;text-align:center;font-weight:700;font-size:16px}
#metrics{left:12px;bottom:18px;min-width:190px;font-size:13px;line-height:1.55}
.ok{color:#5dffae}.bad{color:#ff6b6b}.warn{color:#ffd166}
@media(max-width:600px){
#top{flex-wrap:wrap}
#counter{font-size:20px}
.panel{padding:8px}
}
</style>
</head><body>
<div id="app"><video id="video" playsinline autoplay muted></video>
<canvas id="output"></canvas>

<div id="top" class="panel">
<select id="exerciseSelect">
<option value="pushup">Push-ups</option>
<option value="dip">Fondos</option>
<option value="squat">Squats</option>
<option value="pullup">Pull-ups</option>
</select><div id="counter">Reps: 0</div><button id="startBtn">Activar cámara</button>

</div><div id="metrics" class="panel">
Detector: —<br>
Confianza: —<br>
Ángulo codo: —<br>
Alineación: —
</div><div id="status" class="panel">
Selecciona Push-ups y activa la cámara.
</div></div><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script><script>

const video=document.getElementById('video');
const canvas=document.getElementById('output');
const ctx=canvas.getContext('2d');

const statusEl=document.getElementById('status');
const counterEl=document.getElementById('counter');
const metricsEl=document.getElementById('metrics');

const startBtn=document.getElementById('startBtn');
const exerciseSelect=document.getElementById('exerciseSelect');

let detector=null;
let reps=0;

let state='WAITING';

let lastFrame=0;
let stream=null;

let angleHistory=[];

const CONF=.45;


/* =========================
   UTILIDADES
========================= */

function kp(p,i){

const x=p.keypoints[i];

return x && x.score>=CONF ? x : null;

}


function angle(a,b,c){

if(!a||!b||!c)return null;

const abx=a.x-b.x;
const aby=a.y-b.y;

const cbx=c.x-b.x;
const cby=c.y-b.y;

const magnitude=
Math.hypot(abx,aby)*
Math.hypot(cbx,cby);

if(!magnitude)return null;

const dot=abx*cbx+aby*cby;

return Math.acos(
Math.max(-1,Math.min(1,dot/magnitude))
)*180/Math.PI;

}


function median(a){

if(!a.length)return null;

const x=[...a].sort((a,b)=>a-b);

return x[Math.floor(x.length/2)];

}


function smooth(v){

if(v==null)return null;

angleHistory.push(v);

if(angleHistory.length>7)
angleHistory.shift();

return median(angleHistory);

}


function status(message,type=''){

statusEl.className='panel '+type;

statusEl.textContent=message;

}


function reset(){

reps=0;

state='WAITING';

angleHistory=[];

counterEl.textContent='Reps: 0';

status(
'Colócate de lado, con cuerpo completo visible.',
'warn'
);

}


/* =========================
   CAMBIO DE EJERCICIO
========================= */

exerciseSelect.addEventListener(
'change',
()=>{

reset();

if(exerciseSelect.value!=='pushup'){

status(
'Esta V2 está optimizada primero para Push-ups.',
'warn'
);

}

});


/* =========================
   CÁMARA
========================= */

startBtn.addEventListener(
'click',
init
);


async function init(){

try{

startBtn.disabled=true;

status(
'Solicitando cámara…',
'warn'
);


try{

stream=
await navigator.mediaDevices.getUserMedia({

audio:false,

video:{
facingMode:{ideal:'environment'},
width:{ideal:1280},
height:{ideal:720}
}

});

}

catch(e){

stream=
await navigator.mediaDevices.getUserMedia({

audio:false,
video:true

});

}


video.srcObject=stream;

await video.play();

await tf.ready();


status(
'Cargando MoveNet Thunder…',
'warn'
);


detector=
await poseDetection.createDetector(

poseDetection.SupportedModels.MoveNet,

{

modelType:
poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,

enableSmoothing:true

}

);


canvas.width=
video.videoWidth || 1280;

canvas.height=
video.videoHeight || 720;


status(
'🟢 Listo. Colócate de lado y muestra todo el cuerpo.',
'ok'
);


requestAnimationFrame(loop);

}

catch(e){

console.error(e);

status(
'❌ No se pudo iniciar cámara/detector. Revisa permisos.',
'bad'
);

startBtn.disabled=false;

}

}


/* =========================
   SELECCIÓN DEL LADO
========================= */

function chooseSide(p){

const left=[
kp(p,5),
kp(p,7),
kp(p,9)
]
.filter(Boolean)
.reduce(
(s,x)=>s+x.score,
0
);


const right=[
kp(p,6),
kp(p,8),
kp(p,10)
]
.filter(Boolean)
.reduce(
(s,x)=>s+x.score,
0
);


return left>=right ? 'L':'R';

}


/* =========================
   JUEZ DE PUSH-UPS
========================= */

function pushup(p){

const side=chooseSide(p);


const sh=
kp(p,side==='L'?5:6);

const el=
kp(p,side==='L'?7:8);

const wr=
kp(p,side==='L'?9:10);

const hip=
kp(p,side==='L'?11:12);

const ank=
kp(p,side==='L'?15:16);


if(
!sh||
!el||
!wr||
!hip||
!ank
){

status(
'🟡 Necesito ver hombro, codo, muñeca, cadera y tobillo.',
'warn'
);

return;

}


/* Ángulo del codo */

const elbow=
smooth(
angle(sh,el,wr)
);


/* Alineación corporal */

const bodyAngle=
angle(sh,hip,ank);

const bodyError=
Math.abs(180-bodyAngle);


/* Confianza */

const confidence=
Math.min(
sh.score,
el.score,
wr.score,
hip.score,
ank.score
);


/* =========================
   UMBRALES
========================= */

const ready=
elbow>150 &&
bodyError<28;


const bottom=
elbow<105 &&
bodyError<35;


const top=
elbow>150 &&
bodyError<28;


/* =========================
   INFORMACIÓN
========================= */

metricsEl.innerHTML=

'Detector: MoveNet Thunder<br>'+
'Confianza: '+
Math.round(confidence*100)+
'%<br>'+
'Ángulo codo: '+
Math.round(elbow)+
'°<br>'+
'Alineación: '+
Math.round(bodyError)+
'°';


/* =========================
   MÁQUINA DE ESTADOS
========================= */


/* POSICIÓN INICIAL */

if(state==='WAITING'){

if(ready){

state='TOP';

status(
'🟢 Posición inicial correcta. Baja para comenzar.',
'ok'
);

}

return;

}


/* ARRIBA */

if(state==='TOP'){

if(!top){

state='DOWN';

status(
'🔵 Bajando…'
);

}

return;

}


/* BAJANDO */

if(state==='DOWN'){

/* Alcanzó profundidad */

if(bottom){

state='BOTTOM';

status(
'🟢 Profundidad alcanzada. Sube.',
'ok'
);

}


/* Se arrepintió y volvió arriba */

else if(elbow>145){

state='TOP';

status(
'❌ NO REP — No alcanzaste suficiente profundidad.',
'bad'
);

}

return;

}


/* FONDO */

if(state==='BOTTOM'){

if(elbow>125){

state='UP';

}

return;

}


/* SUBIENDO */

if(state==='UP'){

if(top){

reps++;

counterEl.textContent=
'Reps: '+reps;

state='TOP';

status(
'✅ REP VÁLIDA',
'ok'
);

}

return;

}

}


/* =========================
   DIBUJAR ESQUELETO
========================= */

function draw(p){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);


const pairs=
poseDetection.util.getAdjacentPairs(
poseDetection.SupportedModels.MoveNet
);


ctx.lineWidth=4;

ctx.strokeStyle='#00ff66';


pairs.forEach(
([i,j])=>{

const a=p.keypoints[i];
const b=p.keypoints[j];


if(
a.score>=CONF &&
b.score>=CONF
){

ctx.beginPath();

ctx.moveTo(
a.x,
a.y
);

ctx.lineTo(
b.x,
b.y
);

ctx.stroke();

}

}
);


p.keypoints.forEach(
x=>{

if(x.score>=CONF){

ctx.beginPath();

ctx.arc(
x.x,
x.y,
5,
0,
Math.PI*2
);

ctx.fillStyle='#00ff66';

ctx.fill();

}

}
);

}


/* =========================
   LOOP PRINCIPAL
========================= */

async function loop(t){

if(
!detector ||
video.readyState<2
){

requestAnimationFrame(loop);

return;

}


/* Limitamos aproximadamente a 30 FPS */

if(
t-lastFrame<33
){

requestAnimationFrame(loop);

return;

}

lastFrame=t;


try{

const poses=
await detector.estimatePoses(
video,
{
maxPoses:1,
flipHorizontal:false
}
);


if(poses.length){

draw(
poses[0]
);


if(
exerciseSelect.value==='pushup'
){

pushup(
poses[0]
);

}

}
else{

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);


status(
'🟡 No detecto una persona. Aléjate y muestra el cuerpo completo.',
'warn'
);

}

}

catch(e){

console.error(e);

}


requestAnimationFrame(loop);

}

</script></body>
</html>
